server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS so upstream is resolved per-request, not at startup.
    # Without this, nginx fails to start if the backend container isn't yet reachable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA fallback — let Vue Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API traffic to the backend service
    location /pub/ {
        set $backend http://backend:3000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
    }

    location /protected/ {
        set $backend http://backend:3000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Cookie            $http_cookie;
    }
}
